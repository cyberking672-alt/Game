name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # --------------------------------------------------
      # Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # --------------------------------------------------
      # Create .env
      # IMPORTANT:
      # Do NOT put quotes around GEMINI_API_KEY.
      # --------------------------------------------------
      - name: Create .env file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY GitHub Secret is not configured."
            exit 1
          fi

          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env

          echo ".env file created successfully."

      # --------------------------------------------------
      # Generate debug keystore
      # --------------------------------------------------
      - name: Generate debug keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      # --------------------------------------------------
      # Make Gradle executable
      # --------------------------------------------------
      - name: Grant Execute Permission
        run: chmod +x gradlew

      # --------------------------------------------------
      # Verify Gradle
      # --------------------------------------------------
      - name: Check Gradle
        run: ./gradlew --version

      # --------------------------------------------------
      # Clean project
      # --------------------------------------------------
      - name: Clean
        run: ./gradlew clean --stacktrace

      # --------------------------------------------------
      # Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      # --------------------------------------------------
      # Check APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
